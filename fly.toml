app = "mt-gede-pocketbase"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile.pocketbase"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[mounts]
  source = "pb_data"
  destination = "/pb/pb_data"
